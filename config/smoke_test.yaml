experiment_name: smoke_test_hirma
random_seeds: [111]
run_mode: smoke
hardware:
  device: cpu
models:
  dummy_local:
    engine: dummy  # lightweight backend for the smoke test
    name_or_path: dummy
    tensor_parallel_size: 1
    temperature: 0.7
llm_apis: {}
guardrails:
  - none
  - pat
  - tarpo
  - hirma
# ------------------------------------------------------------------ datasets
# Use local stub JSONL files to avoid network / permission issues.
# Each file contains <=10 rows so slice spec is unnecessary.
datasets:
  jailbreakbench:
    file: data/jailbreakbench_stub.jsonl
  jambench:
    file: data/jambench_stub.jsonl
metrics:
  - multi_turn_asr
  - single_turn_asr
output_dir: .research/iteration4
