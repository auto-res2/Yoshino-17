[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hirma-guardrails"
version = "0.1.0"
description = "Structured refactor of HIRMA experimentation code"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.21.0",
  "pyyaml>=6.0",
  "datasets>=2.14.0",
  "torch>=1.9.0",
  "transformers>=4.36.0",
  "matplotlib>=3.7.0",
  "seaborn>=0.12.0",
  "vllm>=0.4.0",
]

[tool.setuptools]
package-dir = {"" = "src"}
